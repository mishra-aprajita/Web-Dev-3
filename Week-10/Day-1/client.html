<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.socket.io/4.8.4/socket.io.min.js" integrity="sha384-fBrXvbDtHoeKWJ/hcA6M+YGueiDW+h45I7V6F2kD1S8bOkrF9rZYPLVkCR6BLR/1" crossorigin="anonymous"></script>

<body>
    <h1>Welcome to socket.io client side</h1>

<script>
    const socket = io ("ws:http://localhost:8080/",{
        "transport":["websocket"]
    });

    socket.emit("chat","Hello from client");

    socket.on("chat",(cd) =>{
    console.log(cd);
});

</script>
